<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Request Evaluation - GlobalCare Health</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation Bar -->
    <nav class="navbar">
        <a href="/" class="logo">GLOBALCARE HEALTH</a>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/hospitals">Hospitals</a>
            <a href="/doctors">Doctors</a>
            <a href="/treatments">Treatments</a>
            <a href="/cost-estimator">Cost Estimator</a>
            <a href="/contact" class="btn-nav">Free Consultation</a>
        </div>
    </nav>

    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>

    <!-- Main Content -->
    <main class="main-container">
        <h2 class="section-title" style="text-align: center;">Request Your Free Treatment Evaluation</h2>
        <p style="text-align: center; color: var(--gray); max-width: 700px; margin: 0 auto 30px auto;">Submit your medical details securely. Our doctors will review your case within 24 hours.</p>

        <!-- Centered Form Container -->
        <div class="form-container">
            <form action="/submit" method="POST" enctype="multipart/form-data">
                
                <div class="form-group">
                    <label>Patient Full Name *</label>
                    <input type="text" name="name" required placeholder="John Doe">
                </div>

                <div class="form-group">
                    <label>Email Address *</label>
                    <input type="email" name="email" required placeholder="john@example.com">
                </div>

                <div class="form-group">
                    <label>Phone / WhatsApp *</label>
                    <input type="text" name="phone" required placeholder="+1 (555) 234-5678">
                </div>

                <div class="form-group">
                    <label>Required Treatment *</label>
                    <select name="treatment">
                        <option value="Cardiology & Heart Surgery">Cardiology & Heart Surgery</option>
                        <option value="Orthopedic & Joint Replacement">Orthopedic & Joint Replacement</option>
                        <option value="IVF & Fertility Care">IVF & Fertility Care</option>
                        <option value="Advanced Dentistry">Advanced Dentistry</option>
                        <option value="Oncology Care">Oncology Care</option>
                        <option value="Organ Transplant">Organ Transplant</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Preferred Destination</label>
                    <select name="destination">
                        <option value="Thailand (Apex Medical Center)">Thailand (Apex Medical Center)</option>
                        <option value="India (Metro Heart & Superspecialty)">India (Metro Heart & Superspecialty)</option>
                        <option value="Turkey (AciBadem Health Hub)">Turkey (AciBadem Health Hub)</option>
                    </select>
                </div>

                <div class="form-group full">
                    <label>Medical Summary / Symptoms</label>
                    <textarea name="message" rows="4" placeholder="Describe your current diagnosis or treatment requirements..."></textarea>
                </div>

                <div class="form-group full">
                    <label>Upload Medical Report / Prescription (PDF, JPG, PNG)</label>
                    <input type="file" name="medical_report" style="border: none; padding-left: 0;">
                </div>

                <div class="form-group full">
                    <button type="submit" class="btn-submit" style="width: 100%; padding: 12px; background-color: var(--primary); color: white; border: none; border-radius: 8px; font-weight: bold; cursor: pointer;">Submit Confidential Inquiry</button>
                </div>

            </form>
        </div>
    </main>

</body>
</html>
