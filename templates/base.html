<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}GlobalCare Health{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>

    <!-- Navigation Bar (Updates everywhere automatically when changed here) -->
    <nav class="navbar">
        <a href="/" class="logo">GLOBALCARE HEALTH</a>
        <button class="menu-toggle" onclick="toggleMobileMenu()">☰</button>
        <div class="nav-links" id="navLinks">
            <a href="/">Home</a>
            <a href="/about">About Us</a>
            <a href="/hospitals">Hospitals</a>
            <a href="/doctors">Doctors</a>
            <a href="/treatments">Treatments</a>
            <a href="/cost-estimator">Cost Estimator</a>

            {% if session.get('user_id') %}
                <a href="/dashboard" style="color: var(--primary); font-weight: 600;">My Dashboard</a>
                <a href="/logout" style="color: #ef4444; font-weight: 600;">Logout</a>
            {% else %}
                <a href="/login" style="color: var(--primary); font-weight: 600;">Patient Login</a>
            {% endif %}

            <a href="/contact" class="btn-nav">Free Consultation</a>
        </div>
    </nav>

    <script>
        function toggleMobileMenu() {
            const nav = document.getElementById('navLinks');
            nav.classList.toggle('active');
        }
    </script>

    <!-- Individual Page Content Injects Here -->
    {% block content %}{% endblock %}

</body>
</html>
