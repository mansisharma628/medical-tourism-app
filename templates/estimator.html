{% extends "base.html" %}

{% block title %}Cost Estimator & Global Currencies | GlobalCare Health{% endblock %}

{% block content %}
<script>
    // Exchange rates relative to 1 USD
    const rates = {
        USD: { name: "United States Dollar ($)", symbol: "$", rate: 1.0 },
        EUR: { name: "Euro (€)", symbol: "€", rate: 0.92 },
        GBP: { name: "British Pound (£)", symbol: "£", rate: 0.79 },
        AUD: { name: "Australian Dollar (A$)", symbol: "A$", rate: 1.52 },
        CAD: { name: "Canadian Dollar (C$)", symbol: "C$", rate: 1.36 },
        INR: { name: "Indian Rupee (₹)", symbol: "₹", rate: 83.2 },
        AED: { name: "UAE Dirham (AED)", symbol: "AED ", rate: 3.67 },
        SGD: { name: "Singapore Dollar (S$)", symbol: "S$", rate: 1.34 },
        JPY: { name: "Japanese Yen (¥)", symbol: "¥", rate: 155.0 },
        CHF: { name: "Swiss Franc (CHF)", symbol: "CHF ", rate: 0.89 }
    };

    function updateCurrency() {
        const currencyKey = document.getElementById('currencySelector').value;
        const currencyObj = rates[currencyKey];
        const symbol = currencyObj.symbol;
        const rate = currencyObj.rate;

        document.querySelectorAll('.price-val').forEach(el => {
            const baseUSD = parseFloat(el.getAttribute('data-usd'));
            const converted = Math.round(baseUSD * rate).toLocaleString();
            el.innerText = symbol + converted;
        });
    }
</script>

<main class="main-container">
    <h2 class="section-title">Transparent Cost Estimator</h2>
    <p style="text-align: center; color: var(--gray); max-width: 700px; margin: 0 auto 30px;">Select your home country's currency to view estimated package prices across our network instantly.</p>

    <!-- Global Currency Selector Dropdown -->
    <div style="text-align: right; margin-bottom: 20px;">
        <label style="font-weight: 600; margin-right: 10px;">Select Currency:</label>
        <select id="currencySelector" onchange="updateCurrency()" style="padding: 8px 12px; border-radius: 6px; border: 1px solid #cbd5e1;">
            <option value="USD">USD ($)</option>
            <option value="EUR">EUR (€)</option>
            <option value="GBP">GBP (£)</option>
            <option value="INR">INR (₹)</option>
            <option value="AED">AED (AED)</option>
            <option value="AUD">AUD (A$)</option>
            <option value="CAD">CAD (C$)</option>
            <option value="SGD">SGD (S$)</option>
            <option value="JPY">JPY (¥)</option>
            <option value="CHF">CHF (CHF)</option>
        </select>
    </div>

    <!-- Estimator content/cards table goes here -->
</main>
{% endblock %}
